name: Import complete Property Snaps website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Import prepared website files
        shell: bash
        run: |
          set -euo pipefail
          if test -f index.html; then
            echo "Website already imported."
            exit 0
          fi
          URL="$(printf '%s' '' | base64 --decode)"
          curl --fail --location --silent --show-error --max-time 180 --output site.zip "$URL"
          echo "81449d00a1266b59b323a7483c6fd8fa0651f3179719bafa17e3cde4d8b0f40f  site.zip" | sha256sum --check
          unzip -t site.zip >/dev/null
          mkdir -p extracted
          unzip -q site.zip -d extracted
          cp -a extracted/propertysnaps-site/. .
          rm -rf extracted site.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full Property Snaps website with portfolio and PDF guides"
          git push origin HEAD:main
